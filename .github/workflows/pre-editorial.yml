name: Build PRE editorial facts
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pre-editorial.yml'
      - 'pre-editorial.py'
permissions:
  contents: write
concurrency:
  group: pre-editorial
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Collect verified sports facts
        run: python -u pre-editorial.py
      - name: Save public editorial data
        run: |
          git config user.name "8et editorial"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pre-editorial.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified PRE editorial facts"
            git pull --rebase
            git push
          fi
