name: 8ET public reachability diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reachability-check.yml'
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Public network measurements
        run: |
          python -u - <<'PY'
          import urllib.request, urllib.parse, json, time, concurrent.futures, subprocess
          def get_json(url, data=None):
              req=urllib.request.Request(url,data=json.dumps(data).encode() if data else None,headers={'Accept':'application/json','Content-Type':'application/json','User-Agent':'8ET reachability diagnostics'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.load(r)
          def direct(url):
              cmd=['curl','--silent','--show-error','--location','--max-time','15','--output','/dev/null','--write-out','code=%{http_code} ip=%{remote_ip} dns=%{time_namelookup} tcp=%{time_connect} tls=%{time_appconnect} bytes=%{size_download} total=%{time_total}',url]
              r=subprocess.run(cmd,capture_output=True,text=True,timeout=20)
              print('DIRECT',url,r.returncode,r.stdout,r.stderr[:300],flush=True)
          def globalping(country,typ,host,path):
              label=f'{country} {typ} {host}{path}'
              try:
                  payload={'type':typ,'target':host,'locations':[{'country':country}],'limit':3 if country=='RU' else 2}
                  if typ=='http':payload['measurementOptions']={'protocol':'HTTPS','request':{'method':'GET','path':path}}
                  if typ=='dns':payload['measurementOptions']={'query':{'type':'A'}}
                  created=get_json('https://api.globalping.io/v1/measurements',payload)
                  mid=created['id']
                  print('PROBE_CREATED',label,mid,created.get('probesCount'),flush=True)
                  for i in range(18):
                      result=get_json('https://api.globalping.io/v1/measurements/'+mid)
                      if result.get('status')!='in-progress': break
                      time.sleep(1.2)
                  for row in result.get('results',[]):
                      p=row.get('probe',{});r=row.get('result',{})
                      compact={k:r[k] for k in ('status','resolvedAddress','statusCode','timings','stats','answers','error') if k in r}
                      compact['rawOutput']=str(r.get('rawOutput',''))[:350]
                      print('PROBE_RESULT',label,json.dumps({'city':p.get('city'),'network':p.get('network'),'asn':p.get('asn'),'tags':p.get('tags'),'result':compact},ensure_ascii=False),flush=True)
              except Exception as e:
                  print('PROBE_ERROR',label,str(e),flush=True)
          def checkhost(path):
              try:
                  params=[('host','https://8et.ru'+path)]+[('node',n+'.node.check-host.net') for n in ['ru1','ru2','ru3','de1','pl2']]
                  c=get_json('https://check-host.net/check-http?'+urllib.parse.urlencode(params))
                  print('CHECKHOST_REPORT',path,c.get('permanent_link'),flush=True)
                  mid=c['request_id']
                  for i in range(10):
                      result=get_json('https://check-host.net/check-result/'+mid)
                      if all(v is not None for v in result.values()):break
                      time.sleep(2)
                  print('CHECKHOST_RESULT',path,json.dumps(result,ensure_ascii=False),flush=True)
              except Exception as e:
                  print('CHECKHOST_ERROR',path,str(e),flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              jobs=[ex.submit(direct,'https://8et.ru'+p) for p in ['/','/robots.txt','/upcoming','/api/site-feed']]
              jobs += [ex.submit(checkhost,p) for p in ['/','/robots.txt']]
              jobs += [ex.submit(globalping,c,'http','8et.ru',p) for c in ['RU','DE','PL'] for p in ['/','/robots.txt']]
              jobs += [ex.submit(globalping,'RU','dns','8et.ru',''),ex.submit(globalping,'RU','http','8et.vercel.app','/')]
              for j in concurrent.futures.as_completed(jobs):
                  try:j.result()
                  except Exception as e:print('TEST_ERROR',str(e),flush=True)
          PY
